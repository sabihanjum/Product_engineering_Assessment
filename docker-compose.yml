services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edusupport
      POSTGRES_USER: edusupport
      POSTGRES_PASSWORD: edusupport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://edusupport:edusupport@db:5432/edusupport
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data: